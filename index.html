<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/vite.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="En enkel budgetapp för att lägga till inkomster och utgifter, välja kategori och följa din balans."
    >
    <title>inl2-js</title>
  </head>
  <body>
    <main id="app">
      <header>
        <h1>Budget</h1>
        <p>Lägg till utgifter och inkomster.</p>
        <div id="balance-card">
          <span>Balans</span>
          <strong id="balance" class="balance zero">0.00 kr</strong>
        </div>
      </header>

      <nav class="view-switcher" aria-label="Välj vy">
        <button type="button" class="view-btn is-active" data-view="expense">Utgifter</button>
        <button type="button" class="view-btn" data-view="income">Inkomster</button>
      </nav>

      <section id="expense-panel" class="entry-panel">
        <h2>Utgifter</h2>
        <form id="expense-form" autocomplete="off">
          <label>
            Beskrivning
            <input id="desc" type="text" placeholder="T.ex. Mat" required>
          </label>

          <label>
            Belopp (kr)
            <input id="amount" type="number" step="0.01" min="0" placeholder="0.00" required>
          </label>

          <label>
            Kategori
            <select id="expense-category" required>
              <option value="" selected disabled>Välj kategori</option>
            </select>
          </label>

          <button type="submit">Lägg till</button>
        </form>

        <ul id="expense-list"></ul>
      </section>

      <section id="income-panel" class="entry-panel is-hidden">
        <h2>Inkomster</h2>
        <form id="income-form" autocomplete="off">
          <label>
            Beskrivning
            <input id="income-desc" type="text" placeholder="T.ex. Lön" required>
          </label>

          <label>
            Belopp (kr)
            <input
              id="income-amount"
              type="number"
              step="0.01"
              min="0"
              placeholder="0.00"
              required
            >
          </label>

          <label>
            Kategori
            <select id="income-category" required>
              <option value="" selected disabled>Välj kategori</option>
            </select>
          </label>

          <button type="submit">Lägg till</button>
        </form>

        <ul id="income-list"></ul>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
