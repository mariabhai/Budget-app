<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>inl2-js</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Budget</h1>
        <p>Lägg till utgifter och inkomster.</p>
      </header>

      <section>
        <h2>Utgifter</h2>
        <form id="expense-form" autocomplete="off">
          <label>
            Beskrivning
            <input id="desc" type="text" placeholder="T.ex. Mat" required />
          </label>

          <label>
            Belopp (kr)
            <input
              id="amount"
              type="number"
              step="0.01"
              min="0"
              placeholder="0.00"
              required
            />
          </label>

          <button type="submit">Lägg till</button>
        </form>

        <ul id="expense-list"></ul>
      </section>

      <section>
        <h2>Inkomster</h2>
        <form id="income-form" autocomplete="off">
          <label>
            Beskrivning
            <input id="income-desc" type="text" placeholder="T.ex. Lön" required />
          </label>

          <label>
            Belopp (kr)
            <input
              id="income-amount"
              type="number"
              step="0.01"
              min="0"
              placeholder="0.00"
              required
            />
          </label>

          <button type="submit">Lägg till</button>
        </form>

        <ul id="income-list"></ul>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
